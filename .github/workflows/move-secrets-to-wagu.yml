# 5.01.04 (one time): seals DISCORD_TOKEN + AUTH_PRIVATE_KEY with the wagu repo's Actions public key, so they
# can be stored as wagu secrets. Only GitHub can open the sealed values. Removed again right after.
name: Move secrets to wagu
on: workflow_dispatch
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q pynacl
      - env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          AUTH_PRIVATE_KEY: ${{ secrets.AUTH_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, base64
          from nacl import public, encoding
          box = public.SealedBox(public.PublicKey("O5TeLA9cYThJzvZhElwPQ3vncODc0gj3yYKVIbt5iVo=".encode(), encoding.Base64Encoder()))
          for n in ("DISCORD_TOKEN", "AUTH_PRIVATE_KEY"):
              v = os.environ.get(n, "")
              print("SEALED", n, len(v) > 0, base64.b64encode(box.encrypt(v.encode())).decode())
          PY
